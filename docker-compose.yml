version: '3.8'

services:
  # 1. Web App PHP Thư viện
  app:
    build: ./app
    container_name: library_app
    restart: always
    environment:
      - DB_HOST=db
      - DB_NAME=library_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
    networks:
      - library_net

  # 2. Cơ sở dữ liệu PostgreSQL (Tự động nạp init.sql)
  db:
    image: postgres:15-alpine
    container_name: library_db
    restart: always
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - library_net

  # 3. Trình quản lý CSDL pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: library_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    networks:
      - library_net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: library_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - library_net

  # 5. Prometheus - Thu thập Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: library_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - library_net

  # 6. Grafana - Trực quan hóa Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: library_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - library_net

  # 7. cAdvisor - Giám sát Container
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: library_cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - library_net

  # 8. Loki - Hệ thống tập trung Log
  loki:
    image: grafana/loki:2.8.2
    container_name: library_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/tmp/loki
    networks:
      - library_net

  # 9. Promtail - Agent đọc Log Docker
  promtail:
    image: grafana/promtail:2.8.2
    container_name: library_promtail
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - library_net

networks:
  library_net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
